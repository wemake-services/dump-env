[build-system]
build-backend = "poetry.core.masonry.api"
requires = [ "poetry-core>=2" ]

[tool.poetry]
name = "dump-env"
version = "1.7.0"
description = "A utility tool to create .env files"
license = "MIT"
authors = [ "Nikita Sobolev <mail@sobolevn.me>" ]
readme = "README.md"
homepage = "https://dump-env.readthedocs.io"
repository = "https://github.com/wemake-services/dump-env"
keywords = [ ".env", "CI/CD", "dotenv", "secrets", "templates" ]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies.python = "^3.10"
group.dev.dependencies.mypy = "^2.3"
group.dev.dependencies.pytest = "^9.1"
group.dev.dependencies.pytest-cov = "^7.1"
group.dev.dependencies.pytest-randomly = "^4.1"
group.dev.dependencies.python-dotenv = "^1.1"
group.dev.dependencies.ruff = "^0.16"
group.dev.dependencies.syrupy = "^5.5"
group.dev.dependencies.wemake-python-styleguide = "^1.7"
group.docs.optional = true
group.docs.dependencies.furo = "^2025.12"
group.docs.dependencies.myst-parser = "^4.0"
group.docs.dependencies.sphinx = "^8.1"
group.docs.dependencies.tomli = "^2.0"
scripts.dump-env = "dump_env.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 80
# Ruff config: https://docs.astral.sh/ruff/settings
preview = true
fix = true
format.quote-style = "single"
format.docstring-code-format = false
lint.select = [
  "A",    # flake8-builtins
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "C90",  # maccabe
  "COM",  # flake8-commas
  "D",    # pydocstyle
  "DTZ",  # flake8-datetimez
  "E",    # pycodestyle
  "ERA",  # flake8-eradicate
  "EXE",  # flake8-executable
  "F",    # pyflakes
  "FBT",  # flake8-boolean-trap
  "FLY",  # pyflint
  "FURB", # refurb
  "G",    # flake8-logging-format
  "I",    # isort
  "ICN",  # flake8-import-conventions
  "ISC",  # flake8-implicit-str-concat
  "LOG",  # flake8-logging
  "N",    # pep8-naming
  "PERF", # perflint
  "PIE",  # flake8-pie
  "PL",   # pylint
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "Q",    # flake8-quotes
  "RET",  # flake8-return
  "RSE",  # flake8-raise
  "RUF",  # ruff
  "S",    # flake8-bandit
  "SIM",  # flake8-simpify
  "SLF",  # flake8-self
  "SLOT", # flake8-slots
  "T100", # flake8-debugger
  "TRY",  # tryceratops
  "UP",   # pyupgrade
  "W",    # pycodestyle
  "YTT",  # flake8-2020
]
lint.ignore = [
  "A005",    # allow to shadow stdlib and builtin module names
  "COM812",  # trailing comma, conflicts with `ruff format`
  # Different doc rules that we don't really care about:
  "D100",
  "D104",
  "D106",
  "D203",
  "D212",
  "D401",
  "D404",
  "D405",
  "ISC001",  # implicit string concat conflicts with `ruff format`
  "ISC003",  # prefer explicit string concat over implicit concat
  "PLR09",   # we have our own complexity rules
  "PLR2004", # do not report magic numbers
  "PLR6301", # do not require classmethod / staticmethod when self not used
  "RUF105",  # keep old `# noqa` comments style, not `# ruff` comments
  "RUF106",  # we prefer old error codes
  "RUF201",  # keep old rule codes instead of verbose names
  "TRY003",  # long exception messages from `tryceratops`
]
lint.per-file-ignores."tests/*.py" = [
  "S101", # asserts
  "S404", # subprocess
  "S603", # subprocess
  "S607", # subprocess partial path
]
lint.external = [ "WPS" ]
# Plugin configs:
lint.flake8-quotes.inline-quotes = "single"
lint.mccabe.max-complexity = 6
lint.pydocstyle.convention = "google"
output-prefer-rule-codes = true

[tool.codespell]
# codespell configuration: https://github.com/codespell-project/codespell
skip = [
  "*.lock",
  ".mypy_cache",
  "__pycache__",
  "_build",
]

[tool.typos]
# typos configuration: https://github.com/crate-ci/typos/
files.extend-exclude = [
  "__pycache__",
  "_build",
  ".mypy_cache",
  "*.lock",
]

[tool.mypy]
warn_unreachable = true
local_partial_types = true
enable_error_code = [
  "deprecated",
  "explicit-override",
  "ignore-without-code",
  "possibly-undefined",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "unimported-reveal",
  "unused-awaitable",
]
strict_bytes = true
# The mypy configurations: http://bit.ly/2zEl9WI
strict = true

[tool.pytest]
# pytest config: http://doc.pytest.org/en/latest/customize.html
ini_options.norecursedirs = [
  "*.egg",
  ".eggs",
  ".git",
  ".tox",
  "__pycache__",
  "build",
  "dist",
  "docs",
]
ini_options.addopts = [
  "--strict-config",
  "--strict-markers",
  "--doctest-modules",
  # Output:
  "--tb=short",
  # Coverage:
  "--cov=dump_env",
  "--cov=tests",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-report=html",
  "--cov-report=xml",
  "--cov-fail-under=100",
]
# Strict `@xfail` by default:
ini_options.xfail_strict = true
# Fail on warnings:
ini_options.filterwarnings = [ "error" ]

[tool.coverage]
# Covdefaults: https://pypi.org/project/covdefaults
run.patch = [ "subprocess" ]
